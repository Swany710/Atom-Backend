name: CI

# Everything in this repo was verified by hand before this file existed. This is
# the gate: nothing merges to main that doesn't compile, pass its tests, and
# lint clean.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant — cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile (node:20-alpine). Keep these in step, or CI
          # green stops meaning production works.
          node-version: '20'
          cache: npm

      # npm ci, not npm install: fails loudly if package-lock.json has drifted
      # from package.json instead of quietly resolving something different from
      # what Railway will build.
      #
      # --legacy-peer-deps mirrors the Dockerfile. @nestjs/event-emitter@2 and
      # @nestjs/schedule@3 declare peer support only up to NestJS 10 while this
      # project runs NestJS 11, so a strict resolve fails outright. The repo's
      # .npmrc sets this too; it is repeated here so the reason is visible at
      # the point of failure.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      # --ci: fail rather than write new snapshots.
      # --runInBand: one worker. These suites are small and serial is faster
      #   than spawning workers, and it makes a hung test obvious.
      - name: Test
        run: npm run test:ci

      - name: Lint
        run: npm run lint:ci
